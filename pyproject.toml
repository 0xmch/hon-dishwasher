[project]
name = "hon-dishwasher"
version = "0.1.0"
description = "JSON CLI for dishwashers on Haier's hOn cloud (Hoover, Candy, Haier), built to be driven by scripts and LLM agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = ["pyhon-revived==0.19.2"]

[project.scripts]
hon-dishwasher = "hon_dishwasher:main"

[project.urls]
Repository = "https://github.com/0xmch/hon-dishwasher"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["hon_dishwasher.py"]
